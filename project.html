<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  </head>
  <body>
   
    <div class="w-[100vw] h-[100vh] flex flex-col items-center justify-center  gap-10 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
        <div class="text-white font-medium text-[20px]">
            Increment and Decrement 
        </div>
        <div class="bg-white flex text-[25px] rounded-md gap-8 px-2 p-3">
            <button onclick="decrement()" class="border-r-2 pr-5"><i class="fa-solid fa-minus"></i></button>
            <div class="font-bold" id="count">0</div>
            <button onclick="increment()" class="border-l-2"><i class="fa-solid fa-plus pl-5"></i></button>
        </div>
    </div>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
         <script src="project.js"></script>
  </body>
 
</html>
